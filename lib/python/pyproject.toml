[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percolation-atlas"
version = "1.5.0"
description = "Reference percolation algorithms: Bernoulli, bond/site Newman-Ziff, Leath, bootstrap, invasion, Achlioptas, k-core, labelling, trees/epidemics and message passing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xinyi (Anny)", email = "xinyicui0108@outlook.com" }]
keywords = ["percolation", "statistical-physics", "networks", "monte-carlo", "bootstrap", "invasion-percolation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
[project.urls]
Homepage = "https://cxy2696.github.io/percolation-atlas/"
Repository = "https://github.com/cxy2696/percolation-atlas"
Documentation = "https://github.com/cxy2696/percolation-atlas/blob/main/docs/API.md"

[project.scripts]
atlas-perc = "percolation_atlas.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2"]

[tool.setuptools]
packages = ["percolation_atlas"]

[tool.setuptools.package-data]
percolation_atlas = ["algorithm_index.json"]
